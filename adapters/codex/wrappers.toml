canonical_skill = "task-memory-bank"
canonical_skill_source = "skills/task-memory-bank"

# Plain skills: copied verbatim to the Codex skills dir, no generated wrappers.
[[skills]]
name = "query-kb"
source = "skills/query-kb"

[[skills]]
name = "knowledge-files"
source = "skills/knowledge-files"

[[wrappers]]
name = "memory-init-project"
workflow = "memory.init-project"
description = "Initialize a project in the qmd-backed task memory bank."
argument_hint = "[memory-root] [project] [repo]"
body = "Expected inputs: memory root, project name, repository path. Ask only for missing required inputs. Before canonical init writes anything, run `python3 <this wrapper skill directory>/scripts/codex_sandbox_access.py check --memory-root <memory-root>`. If sandbox paths are missing, offer the exact launch-scoped `--add-dir` restart command or ask before running the helper's explicit `add-roots` subcommand. If `add-roots` changes the config, stop and require a new Codex process plus `/status` verification; do not run init in the current process. Once the sandbox access check passes, use the shared script for deterministic scaffolding."

[[wrappers]]
name = "memory-new-work"
workflow = "memory.new-work"
description = "Create an epic, story, task, or spike in the qmd-backed task memory bank."
argument_hint = "[memory-root] [project] [type] [title]"
body = "Use the shared script to create the work item. Expected inputs: memory root, project name, work type, title. Work type is `epic`, `story`, `task`, or `spike`. Ask only for missing required inputs."

[[wrappers]]
name = "memory-resume"
workflow = "memory.resume"
description = "Resume a qmd-backed task memory bank project or work item."
argument_hint = "[memory-root] [project-or-repo] [work-id]"
body = "Resolve the project, read entrypoint files first, and use qmd only for targeted supporting context. Summarize objective, current state, next action, and missing context before making changes."

[[wrappers]]
name = "memory-update"
workflow = "memory.update"
description = "Append history and refresh active context for a task memory bank work item."
argument_hint = "[work-path] [summary]"
body = "Append history and rewrite `active.md` as compact current state. Reindex only after the write is settled. Expected inputs: work item path and session summary. Ask only for missing required inputs."

[[wrappers]]
name = "memory-branch"
workflow = "memory.branch"
description = "Create an attempt branch inside a task memory bank work item."
argument_hint = "[work-path] [attempt-name] [reason]"
body = "Use attempts only for meaningfully divergent plans or implementations. Expected inputs: work item path, attempt name, and reason. Ask only for missing required inputs."

[[wrappers]]
name = "memory-handoff"
workflow = "memory.handoff"
description = "Write a concise handoff for a task memory bank work item."
argument_hint = "[work-path]"
body = "Write a concise handoff into history and compact `active.md`. Reindex only after the write is settled. Expected input: work item path. Ask only if the active work item cannot be inferred."

[[wrappers]]
name = "memory-reindex"
workflow = "memory.reindex"
description = "Manually reindex qmd when automatic lifecycle hooks are unavailable."
argument_hint = "[optional-collection-or-memory-root]"
body = "Manual fallback when no matching Codex reindex hooks are installed, or installed hooks are disabled, untrusted, interrupted, or fail. Resolve the exact dirty collection names and wait until writes are settled. Run one `qmd update`, then request one-shot approval to run each exact `qmd embed -c <collection>` command outside the spawned-command sandbox. Do not invoke the shared reindex subprocess first when it would hide a sandboxed embed failure. Never request a bare `qmd embed`, broad qmd/Python/shell prefix, or `danger-full-access`. Do not modify memory markdown unless the user explicitly asks for repair."

[[wrappers]]
name = "memory-doctor"
workflow = "memory.doctor"
description = "Check task memory bank structure and qmd health."
argument_hint = "[memory-root]"
body = "Check memory-bank structure, repo mappings, qmd availability, and sandbox access assumptions. Expected input: memory root. Ask only if it cannot be inferred. Run `python3 <this wrapper skill directory>/scripts/codex_sandbox_access.py check --memory-root <memory-root>` before checks that need qmd CLI writes. Offer the helper's explicit `add-roots` subcommand only with user approval. If `add-roots` changes the config, require a new Codex process and `/status` verification. Do not repair memory files unless the user explicitly asks for repairs."
